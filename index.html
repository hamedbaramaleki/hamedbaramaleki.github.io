<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <title>HB</title>
  <style>
    :root {
      --black: #050505;
      --yellow: #ffe600;
      --white: #f5f5f5;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html {
      scroll-behavior: smooth;
      background: var(--black);
    }
    body {
      background: var(--black);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }
    /* INTRO */
    .intro {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      place-items: center;
      background: var(--black);
      animation: introOut 0.8s ease 2.2s forwards;
    }
    .intro-logo {
      color: var(--yellow);
      font-size: clamp(90px, 20vw, 160px);
      font-weight: 900;
      letter-spacing: -12px;
      padding-right: 12px;
      animation: heartbeat 0.9s ease-in-out infinite,
                 blink 1.8s ease-in-out infinite;
      text-shadow: 0 0 35px #ffe60030;
    }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.09); }
      30% { transform: scale(1); }
      45% { transform: scale(1.06); }
      60% { transform: scale(1); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.72; }
    }
    @keyframes introOut {
      to {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
    }
    /* HEADER */
    header {
      position: fixed;
      z-index: 100;
      top: 0;
      left: 0;
      width: 100%;
      height: 82px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(#050505e8, transparent);
    }
    .logo {
      color: var(--yellow);
      font-size: 25px;
      font-weight: 900;
      letter-spacing: -2px;
      text-decoration: none;
    }
    /* MENU BUTTON */
    .menu-button {
      width: 48px;
      height: 48px;
      border: 1px solid #ffe60055;
      border-radius: 14px;
      background: #111;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      transition: border-color .3s, background .3s;
    }
    .menu-button:hover {
      border-color: var(--yellow);
      background: #191919;
    }
    .menu-button span {
      display: block;
      width: 21px;
      height: 2px;
      background: var(--yellow);
      border-radius: 3px;
      transition: transform .4s, opacity .3s;
    }
    .menu-button.active span:first-child {
      transform: translateY(4.5px) rotate(45deg);
    }
    .menu-button.active span:last-child {
      transform: translateY(-4.5px) rotate(-45deg);
    }
    /* DROPDOWN MENU */
    .menu-panel {
      position: fixed;
      z-index: 90;
      top: 0;
      left: 0;
      width: 100%;
      padding: 110px 30px 38px;
      background: #101010;
      border-bottom: 1px solid #ffe60035;
      transform: translateY(-105%);
      visibility: hidden;
      transition:
        transform .55s cubic-bezier(.2, .8, .2, 1),
        visibility .55s;
    }
    .menu-panel.open {
      transform: translateY(0);
      visibility: visible;
    }
    .menu-panel nav {
      display: flex;
      flex-direction: column;
      gap: 15px;
      max-width: 700px;
      margin: auto;
    }
    .menu-panel a {
      width: fit-content;
      color: var(--white);
      text-decoration: none;
      font-size: clamp(25px, 5vw, 40px);
      font-weight: 800;
      transition: color .25s, transform .25s;
    }
    .menu-panel a:hover {
      color: var(--yellow);
      transform: translateX(6px);
    }
    /* HOME */
    .hero {
      min-height: 100svh;
      display: grid;
      place-items: center;
      text-align: center;
      position: relative;
      padding: 100px 20px;
    }
    .hero h1 {
      color: var(--yellow);
      font-size: clamp(110px, 25vw, 260px);
      line-height: .9;
      font-weight: 900;
      letter-spacing: -.11em;
      padding-right: .11em;
      text-shadow: 0 0 60px #ffe60010;
    }
    .hero-line {
      width: 48px;
      height: 3px;
      border-radius: 5px;
      background: var(--yellow);
      margin: 32px auto 0;
    }
    .scroll-note {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      color: #777;
      font-size: 10px;
      letter-spacing: 4px;
      white-space: nowrap;
    }
    /* DOCUMENT */
    .document-section {
      min-height: 85vh;
      padding: 90px 22px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .document {
      width: 100%;
      max-width: 760px;
      padding: clamp(30px, 7vw, 65px);
      background: linear-gradient(145deg, #151515, #0a0a0a);
      border: 1px solid #ffe60040;
      border-radius: 25px;
      opacity: 0;
      transform: translateY(80px);
      transition: opacity .9s ease, transform .9s ease;
    }
    .document.show {
      opacity: 1;
      transform: translateY(0);
    }
    .document-label {
      color: var(--yellow);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 4px;
      margin-bottom: 22px;
    }
    .document h2 {
      color: var(--white);
      font-size: clamp(36px, 7vw, 65px);
      line-height: 1.05;
      letter-spacing: -2px;
      margin-bottom: 24px;
    }
    .document p {
      color: #aaa;
      font-size: 16px;
      line-height: 1.9;
    }
    /* SOCIAL ICONS */
    .socials {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 20px 20px 90px;
    }
    .social-icon {
      width: 60px;
      height: 60px;
      display: grid;
      place-items: center;
      color: var(--yellow);
      background: #111;
      border: 1px solid #ffe60055;
      border-radius: 18px;
      text-decoration: none;
      transition: transform .3s, border-color .3s, background .3s;
    }
    .social-icon:hover {
      transform: translateY(-5px);
      border-color: var(--yellow);
      background: #1b1b1b;
    }
    .social-icon svg {
      width: 26px;
      height: 26px;
      display: block;
    }
    footer {
      border-top: 1px solid #ffffff12;
      padding: 25px;
      text-align: center;
      color: #555;
      font-size: 12px;
      letter-spacing: 3px;
    }
    @media (max-width: 480px) {
      header {
        height: 72px;
        padding: 0 20px;
      }
      .document-section {
        padding: 65px 18px;
      }
      .social-icon {
        width: 55px;
        height: 55px;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <!-- INTRO LOGO -->
  <div class="intro">
    <div class="intro-logo">HB</div>
  </div>
  <!-- HEADER -->
  <header>
    <a href="#home" class="logo">HB</a>
    <button
      class="menu-button"
      id="menuButton"
      aria-label="Open menu"
      aria-expanded="false"
      aria-controls="menuPanel"
    >
      <span></span>
      <span></span>
    </button>
  </header>
  <!-- MENU -->
  <div class="menu-panel" id="menuPanel" aria-hidden="true">
    <nav>
      <a href="#home">Home</a>
      <a href="#document">Document</a>
      <a href="#contacts">Contacts</a>
    </nav>
  </div>
  <!-- MAIN PAGE -->
  <main>
    <section class="hero" id="home">
      <div>
        <h1>HB</h1>
        <div class="hero-line"></div>
      </div>
      <div class="scroll-note">SCROLL DOWN</div>
    </section>
    <!-- DOCUMENT -->
    <section class="document-section" id="document">
      <article class="document" id="documentCard">
        <div class="document-label">DOCUMENT</div>
        <h2>
          Less noise.<br>
          More meaning.
        </h2>
        <p>
          A quiet space. A clear mind.
          Keep moving forward, one step at a time.
        </p>
      </article>
    </section>
    <!-- SOCIAL MEDIA -->
    <section class="socials" id="contacts">
      <!-- Instagram -->
      <a
        class="social-icon"
        href="https://instagram.com/h4amed"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Instagram"
      >
        <svg viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="5"></rect>
          <circle cx="12" cy="12" r="4"></circle>
          <circle cx="17.5" cy="6.5" r="1"
            fill="currentColor" stroke="none"></circle>
        </svg>
      </a>
      <!-- Telegram -->
      <a
        class="social-icon"
        href="https://t.me/h4amed"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Telegram"
      >
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M21.7 4.4 18.5 20c-.24 1.1-.88 1.37-1.78.85l-4.92-3.63-2.37 2.28c-.26.26-.48.48-.98.48l.35-5.01 9.12-8.24c.4-.35-.09-.55-.62-.2L6.02 13.7 1.2 12.2c-1.05-.33-1.07-1.05.22-1.56L20.26 3.3c.88-.32 1.65.22 1.44 1.1Z"></path>
        </svg>
      </a>
    </section>
  </main>
  <footer>HB</footer>
  <script>
    const menuButton = document.getElementById("menuButton");
    const menuPanel = document.getElementById("menuPanel");
    function toggleMenu(open) {
      menuButton.classList.toggle("active", open);
      menuButton.setAttribute("aria-expanded", String(open));
      menuButton.setAttribute(
        "aria-label",
        open ? "Close menu" : "Open menu"
      );
      menuPanel.classList.toggle("open", open);
      menuPanel.setAttribute("aria-hidden", String(!open));
    }
    menuButton.addEventListener("click", () => {
      const isOpen =
        menuButton.getAttribute("aria-expanded") === "true";
      toggleMenu(!isOpen);
    });
    menuPanel.querySelectorAll("a").forEach(link => {
      link.addEventListener("click", () => toggleMenu(false));
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        toggleMenu(false);
      }
    });
    // Document smoothly appears when scrolling down
    const documentCard = document.getElementById("documentCard");
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          documentCard.classList.add("show");
          observer.unobserve(documentCard);
        }
      });
    }, {
      threshold: 0.15
    });
    observer.observe(documentCard);
  </script>
</body>
</html>
